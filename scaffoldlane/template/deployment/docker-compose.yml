services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      APP_ENV: prod
      DATABASE__HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: __PROJECT_NAME__
      POSTGRES_USER: __PROJECT_NAME__
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-__PROJECT_NAME__}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/migrations/001_users.sql:/docker-entrypoint-initdb.d/001_users.sql:ro

volumes:
  postgres_data:
