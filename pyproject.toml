[project]
name = "fastkit"
version = "0.1.0"
description = "Generate FastAPI projects with a reusable application core"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
fastkit = "fastkit.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fastkit*"]

[tool.setuptools.package-data]
fastkit = ["template/**/*", "template/.env.example", "template/.gitignore"]
